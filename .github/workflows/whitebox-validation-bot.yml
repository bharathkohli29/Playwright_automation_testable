name: Whitebox Tool Validation & Self-Healing Bot

on:
  # 1. Triggered across repositories when a commit/PR occurs in ai-testable-platform
  repository_dispatch:
    types: [platform-commit, platform-pr-trigger, testable-run-completed]

  # 2. Triggered manually from UI on any target platform branch
  workflow_dispatch:
    inputs:
      platform_repo:
        description: 'Target Platform Repository (owner/name). Empty = variable PLATFORM_REPO, else testable-platform/ai-testable-platform'
        required: false
        default: ''
      platform_branch:
        description: 'Branch of target platform repo to inspect & validate. Empty = variable PLATFORM_BRANCH, else qa'
        required: false
        default: ''
      run_path:
        description: 'Path to run artifacts directory (e.g. s3 or local folder)'
        required: false
        default: ''
      issue_key:
        description: 'Jira issue key to report against'
        required: false
        default: 'TP-6246'
      dry_run:
        description: 'Perform dry-run without writing to Jira'
        type: boolean
        required: false
        default: false

  # 3. Direct triggers on the automation harness
  push:
    branches:
      - main
      - dev
      - develop
      - 'feat/**'
      - 'release/**'

jobs:
  validate-and-report:
    name: Introspect & Validate External Platform
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve target platform (repo variable PLATFORM_REPO / PLATFORM_BRANCH, inputs or dispatch payload)
        id: cfg
        run: |
          REPO="${{ github.event.inputs.platform_repo || github.event.client_payload.repository || vars.PLATFORM_REPO || 'testable-platform/ai-testable-platform' }}"
          BRANCH="${{ github.event.inputs.platform_branch || github.event.client_payload.branch || vars.PLATFORM_BRANCH || 'qa' }}"
          if [ -z "$REPO" ] || [ -z "$BRANCH" ]; then
            echo "::warning::No target platform configured (set repo variables PLATFORM_REPO and PLATFORM_BRANCH). Skipping validation."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "repo=$REPO" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Automation Framework
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          path: automation-harness

      - name: Checkout Target Platform Repo (Read-Only)
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.cfg.outputs.repo }}
          ref: ${{ steps.cfg.outputs.branch }}
          token: ${{ secrets.PLATFORM_REPO_READ_TOKEN || github.token }}
          persist-credentials: false  # read-only: the target checkout keeps no push credentials
          fetch-depth: 2  # build analyzer diffs HEAD~1; a depth-1 clone would look like "no changes"
          path: target-platform

      - name: Set up Python
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Automation Dependencies
        if: steps.cfg.outputs.configured == 'true'
        working-directory: automation-harness
        run: |
          python -m pip install --upgrade pip
          pip install pydantic openpyxl reportlab pytest requests

      - name: Run automation unit tests
        if: steps.cfg.outputs.configured == 'true'
        working-directory: automation-harness
        env:
          PLATFORM_PATH: ${{ github.workspace }}/target-platform
        run: python -m pytest -q

      - name: Inspect Target Platform Branch & AST Tools
        if: steps.cfg.outputs.configured == 'true'
        working-directory: automation-harness
        run: |
          python cli.py inspect --platform-path "../target-platform" --expect-branch "${{ steps.cfg.outputs.branch }}"

      - name: Execute Autonomous Validation Pipeline
        if: steps.cfg.outputs.configured == 'true'
        working-directory: automation-harness
        env:
          PLATFORM_PATH: ${{ github.workspace }}/target-platform
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          DRY_RUN_FLAG=""
          # plain pushes to the harness never write to Jira; only dispatch runs with dry_run=false do
          if [ "${{ github.event.inputs.dry_run }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          RUN_PATH_FLAG=""
          if [ -n "${{ github.event.inputs.run_path }}" ]; then
            RUN_PATH_FLAG="--run-path ${{ github.event.inputs.run_path }}"
          fi
          python cli.py auto-validate \
            --platform-path "../target-platform" \
            --expect-branch "${{ steps.cfg.outputs.branch }}" \
            --issue-key "${{ github.event.inputs.issue_key || github.event.client_payload.issue_key || 'TP-6246' }}" \
            $RUN_PATH_FLAG \
            $DRY_RUN_FLAG

      - name: Archive QA Deliverables
        if: always() && steps.cfg.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            *.xlsx
            *.pdf
            *.html
            *.png
          if-no-files-found: ignore
