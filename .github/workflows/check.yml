name: check

# Type check and unit tests on every push and pull request to dev and merge-flow. No browser, no AWS, no secrets are needed.
on:
  push:
    branches: [dev, merge-flow]
  pull_request:
    branches: [dev, merge-flow]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm run test:unit
